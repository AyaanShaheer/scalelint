name: 'ScaleLint - Cloud-Native Scalability Scanner'
description: 'Scans application AST, DB schemas, and Kubernetes/KEDA manifests for overnight scaling bottlenecks'
author: 'Ayaan Labs'
branding:
  icon: 'trending-up'
  color: 'red'

inputs:
  path:
    description: 'Directory or file path to scan'
    required: false
    default: '.'
  format:
    description: 'Output format (text, json, sarif)'
    required: false
    default: 'text'
  sarif-file:
    description: 'File path to write SARIF output when format is sarif'
    required: false
    default: 'scalelint.sarif'
  no-fail:
    description: 'Do not fail the CI job with exit code 1 when issues are found'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build ScaleLint Binary
      shell: bash
      run: cargo build --release --manifest-path ${{ github.action_path }}/Cargo.toml

    - name: Run ScaleLint Scan
      shell: bash
      run: |
        EXTRA_FLAGS=""
        if [ "${{ inputs.no-fail }}" = "true" ]; then
          EXTRA_FLAGS="--no-fail"
        fi

        if [ "${{ inputs.format }}" = "sarif" ]; then
          set +e
          ${{ github.action_path }}/target/release/scalelint "${{ inputs.path }}" --format sarif $EXTRA_FLAGS > "${{ inputs.sarif-file }}"
          EXIT_CODE=$?
          set -e
          cat "${{ inputs.sarif-file }}"
          exit $EXIT_CODE
        else
          ${{ github.action_path }}/target/release/scalelint "${{ inputs.path }}" --format "${{ inputs.format }}" $EXTRA_FLAGS
        fi
