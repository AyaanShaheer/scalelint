name: ScaleLint CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Automated Unit Tests
        run: cargo test

      - name: Build ScaleLint Release Binary
        run: cargo build --release

      - name: Verify ScaleLint Exits 1 on SARIF Findings
        run: |
          set +e
          ./target/release/scalelint examples/ --format sarif > scalelint.sarif
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 1 ]; then
            echo "Expected exit code 1 when scalability issues exist, got $EXIT_CODE"
            exit 1
          fi

      - name: Upload SARIF to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scalelint.sarif
