name: ScaleLint CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Automated Unit Tests
        run: cargo test

      - name: Build ScaleLint Release Binary
        run: cargo build --release

      - name: Run ScaleLint Self-Scan (SARIF)
        run: ./target/release/scalelint examples/ --format sarif > scalelint.sarif

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scalelint.sarif
